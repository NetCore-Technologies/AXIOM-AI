name: Publish AXIOM to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
        default: v0.2.0-beta.8
      publish:
        description: Upload the validated distributions to PyPI
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag and project version
        env:
          EXPECTED_TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          python - "$EXPECTED_TAG" <<'PY'
          import sys
          import tomllib

          from packaging.version import Version

          tag = sys.argv[1]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")

          with open("pyproject.toml", "rb") as handle:
              metadata = tomllib.load(handle)

          project_version = Version(str(metadata["project"]["version"]))
          tag_version = Version(tag[1:])
          if project_version != tag_version:
              raise SystemExit(
                  f"pyproject version {project_version} does not match {tag_version}"
              )
          print(f"Packaging AXIOM {project_version} from {tag}")
          PY

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Validate distributions
        run: |
          set -euo pipefail
          python -m twine check dist/*
          python -m pip install --force-reinstall dist/*.whl
          axiom version
          python -m pip check

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: axiom-python-dist-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    if: ${{ github.event_name == 'release' || inputs.publish == true }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/axiom-all
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: axiom-python-dist-${{ env.TAG }}
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
