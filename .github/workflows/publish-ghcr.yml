name: Publish AXIOM container images

on:
  push:
    branches:
      - main
      - latest/development
      - latest/nightly
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  SOURCE_REPOSITORY: https://github.com/manit6752025/AXIOM-AI

jobs:
  validate:
    name: Validate source before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build Control Center and package web assets
        run: npm run build

      - name: Install Python test and model extras
        run: python -m pip install -e '.[test,native-inference,training]'

      - name: Validate release contract
        run: python scripts/release_smoke.py

      - name: Compile Python sources
        run: python -m compileall -q axiom scripts

      - name: Run full Python suite
        run: python -m pytest -q

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run e2e

      - name: Verify packaged Control Center
        run: python -c "from pathlib import Path; import axiom; assert (Path(axiom.__file__).parent / 'webui' / 'index.html').is_file()"

  publish:
    name: Publish ${{ matrix.image }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: axiom-ai
            extras: ""
            platforms: linux/amd64,linux/arm64
          - image: axiom-ai-inference
            extras: native-inference
            platforms: linux/amd64
          - image: axiom-ai-training
            extras: training
            platforms: linux/amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build Control Center into the Docker build context
        run: |
          npm ci
          npm run build

      - name: Verify bundled Control Center is present
        run: test -f axiom/webui/index.html

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/manit6752025/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest-development,enable=${{ github.ref == 'refs/heads/latest/development' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/latest/nightly' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=AXIOM AI ${{ matrix.image }} container
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish verified multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            AXIOM_EXTRAS=${{ matrix.extras }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Verify published manifest and CLI
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag="$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')"
          test -n "$first_tag"
          docker buildx imagetools inspect "$first_tag"
          docker pull "$first_tag"
          docker run --rm --entrypoint axiom "$first_tag" --no-banner version
          docker run --rm --entrypoint python "$first_tag" -c "from pathlib import Path; import axiom; assert (Path(axiom.__file__).parent / 'webui' / 'index.html').is_file()"
