name: Build and Publish Release Assets

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "pyinstaller>=6.22,<7"

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name AXIOM `
            scripts/build_entry.py

      - name: Package Windows release
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart("v")

          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item `
            "dist/AXIOM.exe" `
            "release/AXIOM-$version-windows-x64.exe"

          @"
          AXIOM $version
          Windows x64 portable build.
          "@ | Set-Content "release/README.txt"

          Compress-Archive `
            -Path `
              "release/AXIOM-$version-windows-x64.exe", `
              "release/README.txt" `
            -DestinationPath `
              "release/AXIOM-$version-windows-x64-portable.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "pyinstaller>=6.22,<7"

      - name: Build executable
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name axiom \
            scripts/build_entry.py

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Package Linux release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          mkdir -p release

          # Standalone Linux executable
          cp dist/axiom \
            "release/AXIOM-${VERSION}-linux-x64"

          chmod +x \
            "release/AXIOM-${VERSION}-linux-x64"

          # AppImage layout
          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications

          cp dist/axiom AppDir/usr/bin/axiom
          chmod +x AppDir/usr/bin/axiom

          # Create a minimal valid application icon.
          # This is an SVG so the AppImage can package it without
          # needing an additional image-processing dependency.
          cat > AppDir/axiom.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#0b1020"/>
            <path d="M128 36L214 214H178L157 168H99L78 214H42L128 36ZM128 91L113 137H143L128 91Z" fill="#64ffda"/>
            <circle cx="128" cy="128" r="104" fill="none" stroke="#64ffda" stroke-width="4" opacity="0.35"/>
          </svg>
          EOF

          cat > AppDir/axiom.desktop <<'EOF'
          [Desktop Entry]
          Name=AXIOM
          Comment=Build AI. Own AI.
          Exec=axiom
          Icon=axiom
          Type=Application
          Terminal=true
          Categories=Development;
          EOF

          cp \
            AppDir/axiom.desktop \
            AppDir/usr/share/applications/axiom.desktop

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/axiom" "$@"
          EOF

          chmod +x AppDir/AppRun

          curl -fL \
            -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage

          chmod +x appimagetool.AppImage

          ARCH=x86_64 \
            ./appimagetool.AppImage \
            AppDir \
            "release/AXIOM-${VERSION}-linux-x64.AppImage"

          # Debian package
          PKG="axiom-ai_${VERSION}_amd64"

          mkdir -p \
            "$PKG/DEBIAN" \
            "$PKG/usr/bin" \
            "$PKG/usr/share/doc/axiom-ai"

          cp dist/axiom "$PKG/usr/bin/axiom"
          chmod +x "$PKG/usr/bin/axiom"

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: axiom-ai
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: NetCore Technologies
          Description: AXIOM AI engineering platform
           Build AI. Own AI.
          EOF

          cp README.md \
            "$PKG/usr/share/doc/axiom-ai/README.md"

          cp LICENSE \
            "$PKG/usr/share/doc/axiom-ai/LICENSE"

          dpkg-deb \
            --build \
            "$PKG" \
            "release/AXIOM-${VERSION}-linux-x64.deb"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*

  publish:
    name: Publish GitHub Release Assets
    needs:
      - windows
      - linux
    runs-on: ubuntu-24.04

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: windows-release
          path: release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: linux-release
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AXIOM $TAG" \
              --prerelease \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release upload \
            "$TAG" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
