name: Build macOS release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing AXIOM release tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install AXIOM and PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build standalone AXIOM CLI
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/axiom_entry.py" <<'PY'
          from axiom.cli.main import app

          if __name__ == "__main__":
              app()
          PY
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name axiom \
            --collect-all axiom \
            --distpath "$RUNNER_TEMP/pyinstaller-dist" \
            --workpath "$RUNNER_TEMP/pyinstaller-work" \
            --specpath "$RUNNER_TEMP/pyinstaller-spec" \
            "$RUNNER_TEMP/axiom_entry.py"
          test -x "$RUNNER_TEMP/pyinstaller-dist/axiom"
          "$RUNNER_TEMP/pyinstaller-dist/axiom" --help >/dev/null

      - name: Package DMG and tarball
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STAGE="$RUNNER_TEMP/axiom-macos-stage"
          OUT="$RUNNER_TEMP/axiom-macos-output"
          mkdir -p "$STAGE" "$OUT"
          cp "$RUNNER_TEMP/pyinstaller-dist/axiom" "$STAGE/axiom"
          chmod 755 "$STAGE/axiom"
          cat > "$STAGE/README-macos.txt" <<'TXT'
          AXIOM AI — macOS CLI package

          Architecture: see the package file name (arm64 or x64).

          The package contains the standalone `axiom` command. Open Terminal and run:
              ./axiom --help

          To install for the current user, run `install-axiom.command` from this folder.

          This community-built package is not Apple Developer ID signed or notarized.
          macOS may display a Gatekeeper warning. Review the source and checksums before use.
          TXT
          cat > "$STAGE/install-axiom.command" <<'INSTALL'
          #!/bin/bash
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          DEST="$HOME/.local/bin"
          mkdir -p "$DEST"
          install -m 755 "$HERE/axiom" "$DEST/axiom"
          echo "Installed AXIOM CLI to $DEST/axiom"
          echo 'Ensure $HOME/.local/bin is included in your PATH.'
          read -r -p 'Press Enter to close...' _ || true
          INSTALL
          chmod 755 "$STAGE/install-axiom.command"
          DMG="$OUT/AXIOM-AI-${VERSION}-macos-${PACKAGE_ARCH}.dmg"
          TAR="$OUT/AXIOM-AI-${VERSION}-macos-${PACKAGE_ARCH}.tar.gz"
          SUM="$OUT/SHA256SUMS-macos-${PACKAGE_ARCH}.txt"
          tar -czf "$TAR" -C "$STAGE" axiom README-macos.txt install-axiom.command
          hdiutil create -quiet -volname "AXIOM AI ${VERSION} ${PACKAGE_ARCH}" \
            -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          (cd "$OUT" && shasum -a 256 "$(basename "$DMG")" "$(basename "$TAR")" > "$(basename "$SUM")")
          ls -lh "$DMG" "$TAR" "$SUM"

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/axiom-macos-output/*.dmg
            ${{ runner.temp }}/axiom-macos-output/*.tar.gz
            ${{ runner.temp }}/axiom-macos-output/SHA256SUMS-macos-*.txt
          if-no-files-found: error
          retention-days: 14
