<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc" focusable="false" shape-rendering="geometricPrecision">
  <title id="title">AXIOM Saturn mark</title>
  <desc id="desc">A black geometric A wrapped by layered Saturn rings on a warm cream tile.</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#171310" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#dec2aa"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#c69b7d" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Rear ring: two close tones give the orbit a believable edge and depth. -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="64" cy="64" rx="56" ry="23" fill="none" stroke="#171310" stroke-width="8" transform="rotate(-17 64 64)"/>
    <ellipse cx="64" cy="64" rx="56" ry="23" fill="none" stroke="#99684e" stroke-width="2.4" transform="rotate(-17 64 64)"/>
    <ellipse cx="64" cy="64" rx="44" ry="17" fill="none" stroke="#171310" stroke-opacity="0.72" stroke-width="1.7" transform="rotate(-17 64 64)"/>
  </g>

  <!-- The A is a solid monogram so its silhouette survives 16px rendering. -->
  <path d="M29 101 48 27h23l19 74H76l-4.2-16.4H47.2L43 101H29Zm22.7-29h15.5L59.5 42.5 51.7 72Z" fill="#171310" fill-rule="evenodd"/>

  <!-- Front ring: layered strokes pass over the A like a real orbital band. -->
  <g filter="url(#soft-shadow)">
    <path d="M12 76c18 24 48 34 76 27 13-3 23-10 28-19" fill="none" stroke="#171310" stroke-linecap="round" stroke-width="8"/>
    <path d="M12 76c18 24 48 34 76 27 13-3 23-10 28-19" fill="none" stroke="#c69b7d" stroke-linecap="round" stroke-width="4.1"/>
    <path d="M12 76c18 24 48 34 76 27 13-3 23-10 28-19" fill="none" stroke="#99684e" stroke-linecap="round" stroke-width="1.3"/>
  </g>
</svg>
