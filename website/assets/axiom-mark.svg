<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AXIOM Saturn mark</title>
  <desc id="desc">A geometric cream A wrapped by the coffee-colored rings of Saturn.</desc>
  <rect width="128" height="128" rx="28" fill="#171310"/>

  <!-- The rear half of the ring sits behind the A. -->
  <ellipse cx="64" cy="64" rx="55" ry="24" fill="none" stroke="#99684e" stroke-width="8" transform="rotate(-18 64 64)"/>

  <!-- A solid, high-contrast A remains readable at favicon size. -->
  <path d="M29 101 48.5 27h23L91 101H76.5l-4.1-16.5H47.6L43.5 101H29Zm22.4-29h15.2L59 42.7 51.4 72Z" fill="#dec2aa" fill-rule="evenodd"/>

  <!-- The lower arc crosses the A to make the orbital depth unmistakable. -->
  <path d="M12 76c18 24 48 34 76 27 13-3 23-10 28-19" fill="none" stroke="#c69b7d" stroke-linecap="round" stroke-width="8"/>
  <path d="M12 76c18 24 48 34 76 27 13-3 23-10 28-19" fill="none" stroke="#99684e" stroke-linecap="round" stroke-width="2"/>
</svg>
