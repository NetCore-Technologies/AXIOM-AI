<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-labelledby="flow-title flow-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="flow-title">AXIOM workflow</title>
  <desc id="flow-desc">Animated flow showing Inspect, Validate, Plan and Run, all on your own computer.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .bg { fill: #0f172a; }
      .rail { stroke: #1e293b; stroke-width: 4; stroke-linecap: round; }
      .flow { stroke: url(#g); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 8 16; animation: dash 1.1s linear infinite; }
      .node { fill: #111c33; stroke: url(#g); stroke-width: 2.5; }
      .glow { fill: #f59e0b; opacity: 0; animation: glow 4.8s ease-in-out infinite; }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: 1.2s; }
      .d3 { animation-delay: 2.4s; }
      .d4 { animation-delay: 3.6s; }
      .label { font: 700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f8fafc; text-anchor: middle; }
      .cmd { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #fbbf24; text-anchor: middle; }
      .sub { font: 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #94a3b8; text-anchor: middle; }
      .foot { font: 600 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #a78bfa; text-anchor: middle; letter-spacing: 1.5px; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes glow {
        0% { opacity: 0; }
        6% { opacity: 0.32; }
        22% { opacity: 0; }
        100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow, .glow { animation: none; }
      }
    </style>
  </defs>

  <rect class="bg" width="900" height="190" rx="18"/>

  <line class="rail" x1="120" y1="78" x2="780" y2="78"/>
  <line class="flow" x1="120" y1="78" x2="780" y2="78"/>

  <g>
    <rect class="node" x="50" y="38" width="140" height="80" rx="16"/>
    <rect class="glow d1" x="50" y="38" width="140" height="80" rx="16"/>
    <text class="label" x="120" y="70">INSPECT</text>
    <text class="cmd" x="120" y="94">model inspect</text>
  </g>
  <g>
    <rect class="node" x="270" y="38" width="140" height="80" rx="16"/>
    <rect class="glow d2" x="270" y="38" width="140" height="80" rx="16"/>
    <text class="label" x="340" y="70">VALIDATE</text>
    <text class="cmd" x="340" y="94">dataset validate</text>
  </g>
  <g>
    <rect class="node" x="490" y="38" width="140" height="80" rx="16"/>
    <rect class="glow d3" x="490" y="38" width="140" height="80" rx="16"/>
    <text class="label" x="560" y="70">PLAN</text>
    <text class="cmd" x="560" y="94">train plan</text>
  </g>
  <g>
    <rect class="node" x="710" y="38" width="140" height="80" rx="16"/>
    <rect class="glow d4" x="710" y="38" width="140" height="80" rx="16"/>
    <text class="label" x="780" y="70">RUN</text>
    <text class="cmd" x="780" y="94">train run / infer run</text>
  </g>

  <circle r="7" fill="#fbbf24">
    <animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.75;1" path="M120 78 H780"/>
    <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.74;0.78;1"/>
  </circle>

  <text class="sub" x="450" y="148">Check first. Plan around your hardware. Then run.</text>
  <text class="foot" x="450" y="172">100% LOCAL-FIRST</text>
</svg>
