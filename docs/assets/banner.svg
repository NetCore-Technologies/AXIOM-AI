<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1f3a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.04"/>
  </pattern>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Glow orb center -->
  <ellipse cx="600" cy="140" rx="300" ry="140" fill="url(#accentGlow)" filter="url(#blur)"/>

  <!-- Top border line -->
  <rect x="0" y="0" width="1200" height="1" fill="#0ea5e9" fill-opacity="0.4"/>
  <!-- Bottom border line -->
  <rect x="0" y="279" width="1200" height="1" fill="#0ea5e9" fill-opacity="0.2"/>

  <!-- Left geometric accent -->
  <rect x="60" y="100" width="1" height="80" fill="#0ea5e9" fill-opacity="0.3"/>
  <rect x="60" y="100" width="20" height="1" fill="#0ea5e9" fill-opacity="0.3"/>
  <rect x="60" y="180" width="20" height="1" fill="#0ea5e9" fill-opacity="0.3"/>

  <!-- Right geometric accent -->
  <rect x="1139" y="100" width="1" height="80" fill="#0ea5e9" fill-opacity="0.3"/>
  <rect x="1120" y="100" width="20" height="1" fill="#0ea5e9" fill-opacity="0.3"/>
  <rect x="1120" y="180" width="20" height="1" fill="#0ea5e9" fill-opacity="0.3"/>

  <!-- Corner dots -->
  <circle cx="60" cy="100" r="2.5" fill="#0ea5e9" fill-opacity="0.6"/>
  <circle cx="60" cy="180" r="2.5" fill="#0ea5e9" fill-opacity="0.6"/>
  <circle cx="1140" cy="100" r="2.5" fill="#0ea5e9" fill-opacity="0.6"/>
  <circle cx="1140" cy="180" r="2.5" fill="#0ea5e9" fill-opacity="0.6"/>

  <!-- Status pill top -->
  <rect x="522" y="44" width="156" height="22" rx="11" fill="#0ea5e9" fill-opacity="0.1"/>
  <rect x="522" y="44" width="156" height="22" rx="11" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="0.5"/>
  <circle cx="538" cy="55" r="3" fill="#22c55e"/>
  <text x="548" y="59" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#94a3b8" letter-spacing="1.5">ACTIVE DEVELOPMENT</text>

  <!-- AXIOM wordmark -->
  <text x="600" y="138" font-family="'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2">AXIOM</text>

  <!-- Tagline -->
  <text x="600" y="172" font-family="'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Build AI.  Own AI.</text>

  <!-- Bottom label -->
  <text x="600" y="226" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#475569" text-anchor="middle" letter-spacing="3">AI ENGINEERING PLATFORM  ·  NETCORE TECHNOLOGIES</text>

  <!-- Divider line under label -->
  <rect x="480" y="236" width="240" height="0.5" fill="#334155"/>
</svg>
