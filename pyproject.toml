[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-all"
version = "0.3.0b1"  # Keep aligned with axiom/version.py.
description = "Local-first CLI and daemon for inspecting models, datasets, and hardware-aware AI plans."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "cli", "machine-learning", "local-first", "hardware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "fastapi>=0.115",
    "mcp[cli]>=2.0,<3",
    "huggingface_hub>=1.27,<2",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[project.scripts]
axiom = "axiom.cli.main:app"

[project.urls]
Homepage = "https://netcore-technologies.github.io/AXIOM-AI/"
Repository = "https://github.com/NetCore-Technologies/AXIOM-AI"
Documentation = "https://github.com/NetCore-Technologies/AXIOM-AI/wiki/Home"
Issues = "https://github.com/NetCore-Technologies/AXIOM-AI/issues"
Changelog = "https://github.com/NetCore-Technologies/AXIOM-AI/blob/main/docs/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["axiom*"]

[tool.setuptools.package-data]
axiom = ["webui/**/*"]
