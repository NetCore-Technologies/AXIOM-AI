[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-all"
version = "0.2.0-beta.7"
description = "Local-first CLI and daemon for inspecting models, datasets, and hardware-aware AI plans."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "fastapi>=0.115",
    "mcp[cli]>=2.0,<3",
    "huggingface_hub>=1.27,<2",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[project.scripts]
axiom = "axiom.cli.main:app"

[tool.setuptools.packages.find]
include = ["axiom*"]
